
name: Online Shopping Automated Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  automated-testing:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-html

      - name: Run Automated Tests
        run: |
          python -m pytest -v -p pytest_metadata.plugin -p pytest_html.plugin --html=report.html --self-contained-html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopping-test-report
          path: report.html
