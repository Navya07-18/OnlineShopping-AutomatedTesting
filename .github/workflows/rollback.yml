
name: Online Shopping Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to restore'
        required: true
        default: 'v1.0.0'

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Previous Stable Version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install pytest

      - name: Verify Previous Version
        run: |
          python -m pytest -v

      - name: Create Rollback Package
        run: |
          mkdir -p dist
          zip -j dist/rollback-${{ inputs.version }}.zip shopping_app.py

      - name: Upload Rollback Package
        uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ inputs.version }}
          path: dist/*.zip
